<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pantau Udara Hexindo</title>
<meta name="description" content="Pemantauan kualitas udara harian untuk seluruh lokasi operasional PT Hexindo Adiperkasa Tbk.">
<meta name="theme-color" content="#15191c">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<style>
:root{
  --bg:#e3e8ea; --panel:#f6f8f8; --ink:#15191c; --mute:#56626a; --line:#c5cdd2; --soft:#d7dde0;
  --pick:#6a3fb5; --pick-soft:#ece5f8;
  --h1:#0070c0; --h2:#ffd400; --h3:#c00000; --h4:#000; --nd:#a9b1b6;
  --baik:#00a651; --sedang:#0070c0; --tidak:#ffd400; --sangat:#c00000; --bahaya:#000;
  --disp:"Bahnschrift","DIN Alternate","Roboto Condensed","Arial Narrow","Segoe UI",sans-serif;
  --body:"Segoe UI",system-ui,-apple-system,Roboto,"Helvetica Neue",Arial,sans-serif;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:120px}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 var(--body);-webkit-text-size-adjust:100%}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--pick);outline-offset:2px}
h1,h2,h3{font-family:var(--disp);font-stretch:85%;margin:0;line-height:1.15;letter-spacing:.005em}
h1{font-size:clamp(26px,4.2vw,44px);font-weight:700}
h2{font-size:clamp(21px,2.6vw,28px);font-weight:700}
h3{font-size:17px;font-weight:600}
p{margin:0 0 .7em;max-width:74ch}
.num{font-family:var(--disp);font-stretch:85%;font-variant-numeric:tabular-nums}

/* ---------- bilah atas ---------- */
.bar{position:sticky;top:0;z-index:30;background:var(--ink);color:#fff;display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;
  padding:calc(10px + env(safe-area-inset-top,0px)) 18px 10px}
.brand{display:flex;align-items:center;gap:10px;margin-right:auto}
.brand svg{width:34px;height:34px;flex:none}
.brand b{font:700 20px/1 var(--disp);font-stretch:85%;display:block}
.brand span{font-size:12.5px;color:#b9c3c9}
.datebox{display:flex;align-items:stretch;gap:4px}
.bar button,.bar input[type=date]{background:#262c30;border:1px solid #3b444a;color:#fff;border-radius:4px;min-height:38px;padding:0 11px}
.bar input[type=date]{color-scheme:dark;font-family:var(--disp);font-size:16px;padding:0 8px}
.bar button:hover{background:#333b40}
.bar .step{width:38px;padding:0;font-size:20px;line-height:1}
.lang{display:flex}
.lang button{border-radius:0;min-width:44px}
.lang button:first-child{border-radius:4px 0 0 4px}
.lang button:last-child{border-radius:0 4px 4px 0;border-left:0}
.lang button[aria-pressed=true]{background:#fff;color:var(--ink);border-color:#fff;font-weight:700}
.bar .primary{background:#fff;color:var(--ink);border-color:#fff;font-weight:700}
.bar .primary:hover{background:#dfe5e8}
.bar .primary[disabled]{opacity:.6;cursor:progress}
.status{background:#262c30;color:#d5dce0;font-size:13px;padding:6px 18px;display:flex;flex-wrap:wrap;gap:4px 18px}
.status .dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:#58d28a;margin-right:6px;vertical-align:baseline}
.status .dot.off{background:#f0a23a}
.status .err{color:#ffb4a8}
.tabs{position:sticky;top:58px;z-index:20;background:var(--bg);border-bottom:1px solid var(--line);display:flex;gap:2px;padding:0 12px;overflow-x:auto}
.tabs a{padding:10px 12px;color:var(--mute);text-decoration:none;font-weight:600;white-space:nowrap;border-bottom:3px solid transparent}
.tabs a:hover{color:var(--ink)}

main{max-width:1320px;margin:0 auto;padding:22px 18px 60px}
section{margin-bottom:44px}
.lead{display:flex;flex-wrap:wrap;align-items:flex-end;gap:8px 16px;margin-bottom:14px}
.lead p{margin:0;color:var(--mute)}
.badge{display:inline-block;font-size:13px;font-weight:600;padding:3px 9px;border-radius:3px;background:var(--ink);color:#fff}
.badge.partial{background:#fff;color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--ink)}
.badge.forecast{background:repeating-linear-gradient(135deg,#fff 0 6px,#e8ebed 6px 12px);color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--ink)}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:16px}
.panel + .panel{margin-top:16px}
.panel > h3{margin-bottom:4px}
.hint{color:var(--mute);font-size:13.5px;margin:0 0 10px}
.empty{padding:36px 18px;text-align:center;color:var(--mute)}
.empty b{display:block;color:var(--ink);font:700 20px var(--disp);margin-bottom:6px}

/* ---------- peta ---------- */
.hero{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:16px;align-items:start}
.mapbox{padding:0;overflow:hidden}
.maptools{display:flex;flex-wrap:wrap;gap:6px;padding:10px 12px;border-bottom:1px solid var(--line);align-items:center}
.chipbtn{background:#fff;border:1px solid var(--line);border-radius:3px;padding:5px 10px;font-size:13.5px}
.chipbtn[aria-pressed=true]{background:var(--pick);border-color:var(--pick);color:#fff;font-weight:600}
.maptools .sp{margin-left:auto}
.mapwrap{position:relative;width:100%;aspect-ratio:960/380;background:#cfdde4}
.mapwrap > *{position:absolute;inset:0;width:100%;height:100%;display:block}
.land-o{fill:#dfe4e2}
.land-i{fill:#f3f1e8;stroke:#9aa6a3;stroke-width:.6;vector-effect:non-scaling-stroke}
.mk{cursor:pointer}
.mk circle.core{stroke:#fff;stroke-width:1.6;vector-effect:non-scaling-stroke;paint-order:stroke}
.mk circle.rim{fill:none;stroke:rgba(21,25,28,.55);stroke-width:.8;vector-effect:non-scaling-stroke}
.mk .pulse{fill:none;stroke-width:2;vector-effect:non-scaling-stroke;transform-box:fill-box;transform-origin:center;animation:pulse 2.2s ease-out infinite}
.mk.sel circle.rim{stroke:var(--pick);stroke-width:3.5}
.mk text{font-family:var(--disp);font-weight:600;paint-order:stroke;stroke:#f6f8f8;stroke-linejoin:round;fill:var(--ink);pointer-events:none}
@keyframes pulse{0%{transform:scale(1);opacity:.85}100%{transform:scale(3.2);opacity:0}}
.maplegend{display:flex;flex-wrap:wrap;gap:6px 16px;padding:10px 12px;border-top:1px solid var(--line);font-size:13px;color:var(--mute)}
.key{display:inline-flex;align-items:center;gap:6px}
.sw{width:13px;height:13px;border-radius:2px;display:inline-block;box-shadow:inset 0 0 0 1px rgba(21,25,28,.35)}

.tiles{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tile{border-radius:5px;padding:10px 12px;color:#fff;position:relative;min-height:92px;border:0;text-align:left;width:100%}
.tile .lv{font:700 15px var(--disp)}
.tile .ct{font:700 40px/1 var(--disp);font-stretch:85%;display:block;margin-top:4px}
.tile .dl{font-size:12.5px;opacity:.92}
.tile.H1{background:var(--h1)} .tile.H2{background:var(--h2);color:var(--ink)} .tile.H3{background:var(--h3)} .tile.H4{background:var(--h4)}
.tile[aria-pressed=true]{outline:3px solid var(--pick);outline-offset:2px}
.nodata{font-size:13px;color:var(--mute);margin:8px 0 0}
.rank{list-style:none;margin:8px 0 0;padding:0}
.rank li{display:grid;grid-template-columns:34px 1fr auto;gap:8px;align-items:center;padding:6px 0;border-top:1px solid var(--soft);cursor:pointer}
.rank li:first-child{border-top:0}
.rank .nm{min-width:0}
.rank .nm b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
.rank .bar2{height:5px;border-radius:2px;margin-top:3px;min-width:2px;box-shadow:inset 0 0 0 1px rgba(21,25,28,.3)}
.rank .v{font:700 19px var(--disp)}

.hx{display:inline-flex;align-items:center;justify-content:center;min-width:32px;height:24px;padding:0 6px;border-radius:3px;font:700 14px var(--disp);color:#fff}
.hx.H1{background:var(--h1)} .hx.H2{background:var(--h2);color:var(--ink)} .hx.H3{background:var(--h3)} .hx.H4{background:var(--h4)}
.hx.ND{background:transparent;color:var(--mute);box-shadow:inset 0 0 0 1.5px var(--nd)}
.cat{display:inline-block;padding:1px 7px;border-radius:3px;font-size:12.5px;font-weight:600;color:#fff;white-space:nowrap}
.cat.baik{background:var(--baik)} .cat.sedang{background:var(--sedang)} .cat.tidak{background:var(--tidak);color:var(--ink)} .cat.sangat{background:var(--sangat)} .cat.bahaya{background:var(--bahaya)}
.src{font-size:12px;color:var(--mute);white-space:nowrap}
.src.resmi,.src.berkas{color:#0a6b3c;font-weight:700}

/* ---------- grafik ---------- */
.chart{width:100%;display:block;overflow:visible}
.chart text{font:12px var(--body);fill:var(--mute)}
.chart .ax{stroke:var(--line);stroke-width:1}
.chart .hit{fill:transparent;cursor:pointer}
.chart .hit:hover{fill:rgba(106,63,181,.10)}
.legend{display:flex;flex-wrap:wrap;gap:4px 16px;font-size:13px;color:var(--mute);margin:0 0 6px}
.legend i{display:inline-block;width:22px;height:0;border-top:3px solid;vertical-align:middle;margin-right:6px}
.comp{display:grid;grid-template-columns:auto 1fr auto;gap:8px 10px;align-items:center;font-size:14px}
.comp .stack{display:flex;height:22px;border-radius:3px;overflow:hidden;background:var(--soft)}
.comp .stack span{display:block;height:100%}
.heatwrap{overflow:auto;max-height:560px;border:1px solid var(--line);border-radius:4px;background:#fff}
.heat{border-collapse:separate;border-spacing:1px;font-size:12.5px;width:100%}
.heat th{width:170px;position:sticky;left:0;background:#fff;text-align:left;font-weight:500;white-space:nowrap;padding:0 10px 0 8px;z-index:2;max-width:190px;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
.heat thead th,.heat thead td{position:sticky;top:0;background:#fff;z-index:3;font-size:11.5px;color:var(--mute);text-align:center;padding:4px 0;height:30px}
.heat thead th{z-index:4;text-align:left;padding-left:8px}
.heat td.c{width:17px;min-width:17px;height:17px;padding:0;cursor:pointer}
.heat td.c.fc{opacity:.5}
.heat td.c.on{box-shadow:0 0 0 2px var(--pick);position:relative;z-index:1}
.heat thead td.on{color:var(--pick);font-weight:700}
.heat tr.grp th{font:700 13px var(--disp);background:var(--soft);color:var(--ink);cursor:default}
.heat tr.grp td{background:var(--soft)}

/* ---------- daftar lokasi ---------- */
.filters{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px;align-items:center}
.filters select,.filters input[type=search],.btn{background:#fff;border:1px solid var(--line);border-radius:4px;min-height:38px;padding:0 10px}
.filters input[type=search]{flex:1 1 180px;min-width:150px}
.btn:hover{border-color:var(--ink)}
.filters .sp{margin-left:auto}
.tblwrap{overflow-x:auto;border:1px solid var(--line);border-radius:6px;background:var(--panel)}
table.lok{border-collapse:collapse;width:100%;min-width:980px}
.lok th{font-size:12.5px;color:var(--mute);font-weight:600;text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--panel)}
.lok td{padding:8px 10px;border-bottom:1px solid var(--soft);vertical-align:middle}
.lok tr:last-child td{border-bottom:0}
.lok tbody tr{cursor:pointer}
.lok tbody tr:hover{background:#fff}
.lok td.r,.lok th.r{text-align:right}
.lok .nm b{font-weight:600}
.lok .nm small{display:block;color:var(--mute);font-size:12.5px}
.lok .big{font:700 20px var(--disp)}
.lok .up{color:#a11d1d;font-size:12.5px} .lok .dn{color:#0a6b3c;font-size:12.5px} .lok .eq{color:var(--mute);font-size:12.5px}
.man{width:78px;min-height:32px;border:1px solid var(--line);border-radius:4px;padding:0 6px;background:#fff;text-align:right}
.man.filled{border-color:#0a6b3c;background:#eaf6ef;font-weight:700}

/* ---------- panel rincian ---------- */
.scrim{position:fixed;inset:0;background:rgba(21,25,28,.45);z-index:40;opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.open{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(480px,100%);background:var(--panel);z-index:50;transform:translateX(102%);transition:transform .22s ease-out;
  overflow-y:auto;padding:calc(16px + env(safe-area-inset-top,0px)) 18px calc(28px + env(safe-area-inset-bottom,0px));box-shadow:-8px 0 30px rgba(21,25,28,.25)}
.drawer.open{transform:none}
.drawer .x{position:sticky;top:0;float:right;background:var(--ink);color:#fff;border:0;border-radius:4px;min-height:36px;padding:0 12px;z-index:3}
.drawer h2{margin:2px 60px 2px 0}
.drawer .meta{color:var(--mute);font-size:13.5px;margin-bottom:12px}
.headline{display:flex;align-items:center;gap:12px;margin:10px 0}
.headline .hx{min-width:54px;height:54px;font-size:26px}
.headline .n{font:700 46px/1 var(--disp);font-stretch:85%}
.headline small{display:block;color:var(--mute);font-size:13px}
.scene{position:relative;height:150px;border-radius:5px;overflow:hidden;border:1px solid var(--line);background:linear-gradient(#bcd8ea,#e9f2f5 78%)}
.scene.H2{background:linear-gradient(#cfcdae,#e7e1c6 78%)} .scene.H3{background:linear-gradient(#a98e70,#cdb694 78%)} .scene.H4{background:linear-gradient(#4f4238,#8a7460 78%)}
.scene svg{position:absolute;inset:0;width:100%;height:100%}
.scene .haze{position:absolute;top:0;bottom:0;left:0;width:200%;animation:drift linear infinite;
  background:radial-gradient(60px 26px at 8% 60%,rgba(120,104,88,.9),transparent 70%),radial-gradient(90px 34px at 24% 42%,rgba(140,124,104,.8),transparent 70%),
  radial-gradient(70px 30px at 41% 68%,rgba(120,104,88,.85),transparent 70%),radial-gradient(60px 26px at 58% 60%,rgba(120,104,88,.9),transparent 70%),
  radial-gradient(90px 34px at 74% 42%,rgba(140,124,104,.8),transparent 70%),radial-gradient(70px 30px at 91% 68%,rgba(120,104,88,.85),transparent 70%),
  linear-gradient(rgba(130,112,94,.55),rgba(150,132,110,.8))}
.scene .haze.b{animation-direction:reverse;filter:blur(3px)}
@keyframes drift{from{transform:translateX(0)}to{transform:translateX(-50%)}}
.cap{font-size:12.5px;color:var(--mute);margin:5px 0 12px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line);border:1px solid var(--line);border-radius:5px;overflow:hidden;margin:10px 0 14px}
.stats div{background:#fff;padding:8px 10px}
.stats small{display:block;color:var(--mute);font-size:12.5px}
.stats b{font:600 18px var(--disp)}
.drawer h3{margin:16px 0 4px}
.ctl{margin:0;padding-left:18px}
.ctl li{margin-bottom:4px}
.manrow{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.manrow .man{width:110px;min-height:40px;font-size:17px}
.also{font-size:13.5px;color:var(--mute)}

.method{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px}
.method .panel{margin-top:0}
.method ul{margin:0;padding-left:18px}
.method li{margin-bottom:5px}
.lvltbl{border-collapse:collapse;width:100%;font-size:14px}
.lvltbl td,.lvltbl th{padding:6px 8px;border-bottom:1px solid var(--soft);text-align:left;vertical-align:top}
footer{color:var(--mute);font-size:13px;border-top:1px solid var(--line);padding-top:14px}

@media (max-width:1020px){ .hero{grid-template-columns:1fr} .hero > div{display:contents} .hero .panel{margin-top:0;order:3} .hero .mapbox{order:1} .hero .p-tiles{order:2} .hero .p-comp{order:4} }
@media (max-width:720px){
  .bar{padding-left:12px;padding-right:12px}
  .brand span{display:none}
  .tabs{top:104px}
  main{padding:16px 12px 50px}
  .tblwrap{border:0;background:none;overflow:visible}
  table.lok{min-width:0}
  .lok thead{display:none}
  .lok tbody tr{display:grid;grid-template-columns:auto 1fr auto;gap:2px 10px;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:10px;margin-bottom:8px;align-items:center}
  .lok td{border:0;padding:0}
  .lok td.c-h{grid-row:1/3} .lok td.nm{grid-column:2} .lok td.c-i{grid-row:1/3;grid-column:3;text-align:right}
  .lok td.c-x{grid-column:1/-1;display:flex;justify-content:space-between;font-size:13.5px;border-top:1px solid var(--soft);padding-top:4px;margin-top:4px;text-align:left}
  .lok td.c-x::before{content:attr(data-l);color:var(--mute)}
  .lok td.c-w,.lok td.c-d{display:none}
  .comp{grid-template-columns:1fr auto}
  .comp > span:nth-child(3n+1){grid-column:1/-1;margin-bottom:-6px;font-weight:600}
  .heat th{max-width:118px}
}
@media (prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  .mk .pulse,.scene .haze{animation:none}
  .drawer,.scrim{transition:none}
}
body.still .mk .pulse, body.still .scene .haze{animation-play-state:paused}
</style>
</head>
<body>

<header class="bar">
  <div class="brand">
    <svg viewBox="0 0 512 512" aria-hidden="true"><rect width="512" height="512" rx="90" fill="#fff"/><rect x="92" y="300" width="70" height="120" fill="#0070c0"/><rect x="178" y="236" width="70" height="184" fill="#ffd400"/><rect x="264" y="164" width="70" height="256" fill="#c00000"/><rect x="350" y="92" width="70" height="328" fill="#000"/></svg>
    <div><b>Pantau Udara</b><span data-i="tagline"></span></div>
  </div>
  <div class="datebox">
    <button class="step" id="dPrev" type="button">&#8249;</button>
    <input type="date" id="dPick">
    <button class="step" id="dNext" type="button">&#8250;</button>
    <button id="dToday" type="button" data-i="today"></button>
  </div>
  <div class="lang" role="group" id="langBox">
    <button type="button" data-lang="id" aria-pressed="true">ID</button>
    <button type="button" data-lang="en" aria-pressed="false">EN</button>
  </div>
  <button class="primary" id="btnPull" type="button" data-i="pull"></button>
</header>
<div class="status" id="status" role="status"></div>
<nav class="tabs" id="tabs">
  <a href="#peta" data-i="navMap"></a><a href="#tren" data-i="navTrend"></a><a href="#lokasi" data-i="navLoc"></a><a href="#metode" data-i="navMethod"></a>
</nav>

<main>
  <section id="peta">
    <div class="lead"><h1 id="h1"></h1><span class="badge" id="dayBadge"></span></div>
    <div id="emptyBox" class="panel empty" hidden></div>
    <div class="hero" id="heroBox">
      <div>
        <div class="panel mapbox">

    `<div class="panel"><h3>${esc(t("m3t"))}</h3><table class="lvltbl"><tr>${T[lang].m3h.map(x => `<th>${esc(x)}</th>`).join("")}</tr>` +
    T[lang].m3.map(r => `<tr><td><span class="hx ${r[0]}">${r[0]}</span> ${esc(t("hn_" + r[0]))}</td><td>${esc(r[1])}</td><td>${esc(r[2])}</td><td>${esc(r[3])}</td></tr>`).join("") + `</table></div>` +
    `<div class="panel"><h3>${esc(t("m4t"))}</h3>${ul(T[lang].m4)}</div>`;
}

/* ---------------- CSV (titik koma, desimal koma, sesuai Excel kantor) ---------------- */
function csv(all) {
  const num = (v, d = 0) => (v == null || isNaN(v) ? "" : Number(v).toFixed(d).replace(".", ","));
  const q = s => `"${String(s ?? "").replace(/"/g, '""')}"`;
  const head = ["tanggal", "id", "lokasi", "tipe", "wilayah", "provinsi", "level", "ISPU", "sumber_ISPU", "kategori_ISPU", "PM2,5_ug_m3", "PM10_ug_m3", "parameter_kritis", "US_AQI_setara", "kategori_BMKG", "ISPU_jam_tertinggi", "jam_tertinggi", "hujan_mm", "angin_km_jam", "arah_angin_derajat", "status_data"];
  const out = [head.map(q).join(";")];
  for (const d of all ? dates : [sel]) for (const l of LOK) {
    const v = val(l, d), a = v.a || {};
    out.push([d, l.id, q(l.nama), q(T.id["t_" + l.tipe]), q(T.id["w_" + l.wilayah]), q(l.provinsi), v.h || "", num(v.ispu), v.src === "resmi" ? "resmi (manual)" : v.src === "berkas" ? "resmi (berkas bersama)" : v.src === "none" ? "" : "setara (model)",
      q(v.ispu == null ? "" : T.id["k_" + catOf(v.ispu)]), num(a.m25, 1), num(a.m10, 1), q(a.crit ? a.crit.replace(".", ",") : ""), num(usAqi(a.m25, a.m10)), q(a.m25 == null ? "" : T.id["k_" + bmkgOf(a.m25)]),
      num(a.peak && a.peak.ispu), a.peak ? String(a.peak.hour).padStart(2, "0") + ".00 " + l.zona : "", num(a.rain, 1), num(a.wind, 1), num(a.wdir), a.status ? { final: "24 jam", partial: "sementara", forecast: "prakiraan" }[a.status] : ""].join(";"));
  }
  const blob = new Blob(["\ufeff" + out.join("\r\n")], { type: "text/csv;charset=utf-8" }), u = URL.createObjectURL(blob), el = document.createElement("a");
  el.href = u; el.download = all ? `pantau-udara_${dates[0]}_sd_${dates[dates.length - 1]}.csv` : `pantau-udara_${sel}.csv`;
  document.body.appendChild(el); el.click(); el.remove(); setTimeout(() => URL.revokeObjectURL(u), 2000);
}

/* ---------------- BERKAS BERSAMA ISPU RESMI ---------------- */
function exportShared() {
  const m = new Map();
  for (const [k, r] of Object.entries(shared)) m.set(k, { tanggal: r.tanggal, id: r.id, ispu: r.ispu, stasiun: r.stasiun || "", sumber: r.sumber || "" });
  for (const [k, v] of Object.entries(manual)) {
    const [id, tanggal] = k.split("|"), l = LOK.find(x => x.id === id), old = m.get(k);
    m.set(k, { tanggal, id, ispu: v, stasiun: (old && old.stasiun) || (l && l.stasiunIspu) || "", sumber: (old && old.ispu === v && old.sumber) || "ISPUnet KLH / DLH, diisi PIC" });
  }
  const data = [...m.values()].sort((a, b) => a.tanggal.localeCompare(b.tanggal) || a.id.localeCompare(b.id));
  const doc = { note: "Angka ISPU resmi per lokasi per tanggal. Berkas ini dibaca semua perangkat. Unggah ke akar repositori untuk memperbarui. id mengikuti locations.json.", diperbarui: nowIn(CFG.TZ.WIB).date, data };
  const u = URL.createObjectURL(new Blob([JSON.stringify(doc, null, 1)], { type: "application/json" })), el = document.createElement("a");
  el.href = u; el.download = "ispu-resmi.json"; document.body.appendChild(el); el.click(); el.remove(); setTimeout(() => URL.revokeObjectURL(u), 2000);
}

/* ---------------- PERISTIWA ---------------- */
function wire() {
  $("#btnPull").onclick = pull;
  $("#dPrev").onclick = () => setDate(dates[dates.indexOf(sel) - 1]);
  $("#dNext").onclick = () => setDate(dates[dates.indexOf(sel) + 1]);
  $("#dToday").onclick = () => setDate(dates.includes(today) ? today : dates[dates.length - 1]);
  $("#dPick").onchange = e => { const d = e.target.value; if (dates.includes(d)) setDate(d); else e.target.value = sel; };
  $("#langBox").onclick = e => { const b = e.target.closest("[data-lang]"); if (!b) return; lang = b.dataset.lang; LS.set("pu2.lang", lang); applyLang(); renderAll(); };
  $("#status").addEventListener("change", e => { if (e.target.id === "winSel") { win = +e.target.value; LS.set("pu2.win", win); if (navigator.onLine) pull(); } });
  $("#viewBtns").onclick = e => {
    const b = e.target.closest("[data-v]");
    if (b) { view = b.dataset.v; smoke.parts = []; drawMap(); return; }
    if (e.target.id === "btnPlay") { playing = !playing; LS.set("pu2.play", playing); drawStatus(); smoke.kick(); }
  };
  const pickId = e => { const g = e.target.closest("[data-id]"); return g ? g.dataset.id : null; };
  $("#mapPts").onclick = e => { const id = pickId(e); if (id) openDetail(id); };
  $("#mapPts").onkeydown = e => { if (e.key === "Enter" || e.key === " ") { const id = pickId(e); if (id) { e.preventDefault(); openDetail(id); } } };
  $("#rank").onclick = e => { const id = pickId(e); if (id) openDetail(id); };
  $("#tiles").onclick = e => { const b = e.target.closest("[data-h]"); if (!b) return; filt.lvl = filt.lvl === b.dataset.h ? "all" : b.dataset.h; $("#fLvl").value = filt.lvl; drawTiles(); drawTable(); $("#lokasi").scrollIntoView(); };
  const onDate = e => { const r = e.target.closest("[data-d]"); if (r) setDate(r.dataset.d); };
  $("#scrub").onclick = onDate; $("#lines").onclick = onDate;
  $("#heat").onclick = e => { const c = e.target.closest("[data-id]"); if (!c) return; if (c.dataset.d) sel = c.dataset.d; detailId = c.dataset.id; renderAll(); openDetail(c.dataset.id); };
  $("#fQ").oninput = e => { filt.q = e.target.value; drawTable(); };
  $("#fWil").onchange = e => { filt.wil = e.target.value; drawTable(); };
  $("#fTipe").onchange = e => { filt.tipe = e.target.value; drawTable(); };
  $("#fLvl").onchange = e => { filt.lvl = e.target.value; drawTiles(); drawTable(); };
  $("#fSort").onchange = e => { filt.sort = e.target.value; drawTable(); };
  $("#csvDay").onclick = () => csv(false); $("#csvAll").onclick = () => csv(true); $("#expJson").onclick = exportShared;
  $("#tbl").addEventListener("click", e => { if (e.target.closest("input")) return; const id = pickId(e); if (id) openDetail(id); });
  $("#tbl").addEventListener("change", e => { const m = e.target.dataset.man; if (m) setManual(m, sel, e.target.value); });
  $("#drawer").addEventListener("click", e => {
    if (e.target.id === "dClose") closeDetail();
    else if (e.target.id === "dSave") setManual(detailId, sel, $("#dMan").value);
    else if (e.target.id === "dClear") setManual(detailId, sel, "");
    else { const r = e.target.closest("[data-d]"); if (r) setDate(r.dataset.d); }
  });
  $("#drawer").addEventListener("keydown", e => { if (e.key === "Enter" && e.target.id === "dMan") setManual(detailId, sel, e.target.value); });
  $("#scrim").onclick = closeDetail;
  document.addEventListener("keydown", e => { if (e.key === "Escape" && detailId) closeDetail(); });
  addEventListener("online", () => { drawStatus(); if (!db || Date.now() - db.at > CFG.STALE_MIN * 6e4) pull(); });
  addEventListener("offline", drawStatus);
  let rz; addEventListener("resize", () => { clearTimeout(rz); rz = setTimeout(() => { if (dates.length) { drawStatus(); drawMap(); drawScrub(); drawLines(); if (detailId) drawDetail(); } }, 150); });
}

/* ---------------- MULAI ---------------- */
async function init() {
  smoke.init(); wire(); applyLang();
  try {
    const j = await (await fetch("locations.json")).json();
    LOK = (j.lokasi || []).map(l => ({ ...l, key: l.lat + "," + l.lon, tz: CFG.TZ[l.zona] || CFG.TZ.WIB }));
  } catch (e) { lastErr = "locations.json: " + e.message; }
  try {
    const r = await fetch("ispu-resmi.json", { cache: "no-cache" });
    if (r.ok) for (const x of ((await r.json()).data || [])) if (x && x.id && x.tanggal && x.ispu != null && !isNaN(+x.ispu)) shared[x.id + "|" + x.tanggal] = { ...x, ispu: Math.round(+x.ispu) };
  } catch (e) { /* berkas bersama bersifat opsional */ }
  const m = new Map(); LOK.forEach(l => { if (!m.has(l.key)) m.set(l.key, { key: l.key, lat: l.lat, lon: l.lon, tz: l.tz }); });
  PTS = [...m.values()];
  const saved = LS.get("pu2.db", null);
  if (saved && saved.v === 2 && saved.pts) db = saved;
  compute(); renderAll();
  if (LOK.length && navigator.onLine && (!db || db.win !== win || Date.now() - db.at > CFG.STALE_MIN * 6e4)) pull();
  if ("serviceWorker" in navigator && location.protocol.startsWith("http")) navigator.serviceWorker.register("sw.js").catch(() => {});
}
init();

</script>
